# -- Configuración del servidor --
server.port=8081
spring.application.name=msvc-product

# -- Configuración PostgreSQL --
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_local
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# -- Configuración JPA/Hibernate --
# update: crea/actualiza tablas automaticamente (ideal para dev)
#spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en consola
spring.data.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -- Configuracion Eureka --
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}
#Solución problema de nombre DNS para local host
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=msvc-products
eureka.client.service-url.fetch-registry=true
eureka.client.register-with-eureka=true

#Configuracion de imagenes
#Almacenamiento de imagenes
app.upload.dir=C:/Ambiente/Spring/myWorkspace/ecommerce-local/img/products/
spring.web.resources.static-locations=file:/C:/Ambiente/Spring/myWorkspace/ecommerce-local/img/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

#Configuración Logging
logging.level.root=INFO
logging.level.com.ecommerce.product=DEBUG
# Archivo único por servicio
logging.file.name=C:/Ambiente/Spring/myWorkspace/ecommerce-local/logs/products-service.log
# Desactivar rotación y compresión
#logging.logback.rollingpolicy.file-name-pattern=
#logging.logback.rollingpolicy.max-file-size=0
#logging.logback.rollingpolicy.max-history=0
# Patrones de salida
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - [%X{traceId}] - %logger{40} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
# JPA SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.data.jpa.repository.query=DEBUG

feign.circuitbreaker.enabled=true

# Timeout de Feign para forzar que el CB intercepte
feign.client.config.default.connectTimeout=2000
feign.client.config.default.readTimeout=2000
feign.client.config.default.loggerLevel=full
