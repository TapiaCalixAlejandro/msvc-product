# -- SERVER --
server.port=8081
spring.application.name=msvc-product

# -- DATABASE --
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_product
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# -- JPA --
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -- EUREKA --
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=msvc-product

# -- FILES --
app.upload.dir=C:/Ambiente/Spring/myWorkspace/ecommerce-local/img/products/
spring.web.resources.static-locations=file:/C:/Ambiente/Spring/myWorkspace/ecommerce-local/img/

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# -- LOGGING --
logging.level.root=INFO
logging.level.com.ecommerce.product=DEBUG
logging.file.name=C:/Ambiente/Spring/myWorkspace/ecommerce-local/logs/products-service.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - [%X{traceId}] - %logger{40} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -- FEIGN --
feign.circuitbreaker.enabled=true
feign.client.config.default.connectTimeout=10000
feign.client.config.default.readTimeout=10000
feign.client.config.default.loggerLevel=full